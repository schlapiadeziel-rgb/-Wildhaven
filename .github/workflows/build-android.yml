name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Bundle game for offline play
        run: |
          mkdir -p android/app/src/main/assets/assets
          base64 --decode .github/game-assets.tar.gz.b64 | tar -xz -C android/app/src/main/assets
      - run: gradle -p android :app:assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Wildhaven-Home-Preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Wildhaven-debug-apk
          path: Wildhaven-Home-Preview.apk
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Wildhaven-debug-apk
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: home-preview-${{ github.run_number }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" Wildhaven-Home-Preview.apk --target "$RELEASE_SHA" --title "Wildhaven home building preview" --prerelease --notes "Separate application ID: installs alongside the previous Wildhaven app and does not migrate its save. Includes modular houses, storage, upgrades, decorations, home score and local camp preview. Model-level tests passed; Android touch, LAN and Bluetooth behavior still need physical-device verification. Debug signing remains unsuitable for guaranteed in-place upgrades."
