name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Bundle game for offline play
        run: |
          mkdir -p android/app/src/main/assets
          cp -a game/. android/app/src/main/assets/
      - name: Restore fixed release signing key
        env:
          WILDHAVEN_KEYSTORE_BASE64: ${{ secrets.WILDHAVEN_KEYSTORE_BASE64 }}
        run: |
          test -n "$WILDHAVEN_KEYSTORE_BASE64"
          printf '%s' "$WILDHAVEN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wildhaven-release.jks"
      - name: Build signed release APK
        env:
          WILDHAVEN_KEYSTORE_PATH: ${{ runner.temp }}/wildhaven-release.jks
          WILDHAVEN_STORE_PASSWORD: ${{ secrets.WILDHAVEN_STORE_PASSWORD }}
          WILDHAVEN_KEY_ALIAS: ${{ secrets.WILDHAVEN_KEY_ALIAS }}
          WILDHAVEN_KEY_PASSWORD: ${{ secrets.WILDHAVEN_KEY_PASSWORD }}
        run: gradle -p android :app:assembleRelease
      - run: cp android/app/build/outputs/apk/release/app-release.apk Wildhaven-v102.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Wildhaven-release-apk
          path: Wildhaven-v102.apk
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Wildhaven-release-apk
      - name: Publish formal APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v1.4.2
          RELEASE_SHA: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" Wildhaven-v102.apk --target "$RELEASE_SHA" --title "霁野 · Wildhaven 1.4.2" --latest --notes "情境交互更新：靠近箱子后使用统一互动按钮直接打开，门、工作台、采集、遗迹和车辆会自动切换文字与图标；靠近自己的建筑时单独显示回收按钮，并增加二次确认防止误拆；移除建造和建筑详情中的重复回收入口，减少按钮堆叠和误触。可直接覆盖 1.4.1 更新。"
