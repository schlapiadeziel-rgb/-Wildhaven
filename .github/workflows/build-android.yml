name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['game/**', 'android/**', 'tests/**', '.github/workflows/build-android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify game rules
        run: |
          node --test tests/game.test.mjs tests/local-room.test.mjs
          node tests/home.mjs
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Bundle game for offline play
        run: |
          mkdir -p android/app/src/main/assets
          cp -a game/. android/app/src/main/assets/
      - name: Restore fixed release signing key
        env:
          WILDHAVEN_KEYSTORE_BASE64: ${{ secrets.WILDHAVEN_KEYSTORE_BASE64 }}
        run: |
          test -n "$WILDHAVEN_KEYSTORE_BASE64"
          printf '%s' "$WILDHAVEN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wildhaven-release.jks"
      - name: Build signed release APK
        env:
          WILDHAVEN_KEYSTORE_PATH: ${{ runner.temp }}/wildhaven-release.jks
          WILDHAVEN_STORE_PASSWORD: ${{ secrets.WILDHAVEN_STORE_PASSWORD }}
          WILDHAVEN_KEY_ALIAS: ${{ secrets.WILDHAVEN_KEY_ALIAS }}
          WILDHAVEN_KEY_PASSWORD: ${{ secrets.WILDHAVEN_KEY_PASSWORD }}
        run: gradle -p android :app:assembleRelease
      - run: cp android/app/build/outputs/apk/release/app-release.apk Wildhaven-v112.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Wildhaven-release-apk
          path: Wildhaven-v112.apk
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Wildhaven-release-apk
      - name: Publish formal APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v1.4.12
          RELEASE_SHA: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" Wildhaven-v112.apk --target "$RELEASE_SHA" --title "霁野 · Wildhaven 1.4.12" --latest --notes "修复附近伙伴刚加入时第一次建造或攻击被忽略的问题；回收篝火时同步清理动画引用，避免重复建造后资源持续累积。保留离线单机、Wi-Fi 与蓝牙附近联机。"
